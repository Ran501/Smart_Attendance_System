name: smart_attendence_system
description: FacePass Bhutan AI-powered smart campus attendance system.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  camera: ^0.11.1
  tflite_flutter: ^0.11.0
  google_mlkit_face_detection: ^0.12.0
  permission_handler: ^11.4.0
  mobile_scanner: ^6.0.6
  connectivity_plus: ^6.1.4
  device_info_plus: ^11.3.3
  uuid: ^4.5.1
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  path_provider: ^2.1.5
  media_store_plus: ^0.1.3
  pdf: ^3.11.3
  excel: ^4.0.6
  csv: ^6.0.0
  image: ^4.3.0
  socket_io_client: ^3.1.1
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  crypto: ^3.0.6

  flutter_blue_plus: ^1.35.5
  flutter_ble_peripheral: ^1.2.6
  fl_chart: ^0.69.2
  syncfusion_flutter_charts: ^28.2.9
  glassmorphism: ^3.0.0
  lottie: ^3.3.0
  cached_network_image: ^3.4.1
  printing: ^5.14.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true
  assets:
    - assets/models/mobile_face_net.tflite
    - assets/images/
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true